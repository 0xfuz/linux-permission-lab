name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Confirm zero dependencies
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies||{}).length + Object.keys(require('./package.json').devDependencies||{}).length")
          if [ "$deps" != "0" ]; then
            echo "This project is meant to stay dependency-free. Found $deps declared dependencies."
            exit 1
          fi

      - name: Run test suite
        run: npm test

      - name: Syntax-check every JS module (catches anything the test suite doesn't import)
        run: |
          fail=0
          for f in $(find assets/js -name "*.js"); do
            if ! node --input-type=module --check < "$f" > /tmp/err.txt 2>&1; then
              echo "::error file=$f::$(cat /tmp/err.txt)"
              fail=1
            fi
          done
          exit $fail
